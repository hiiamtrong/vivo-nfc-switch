plugins { id "com.android.application" }

def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def releaseValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }

android {
    namespace "com.hiiamtrong.nfcswitch"
    compileSdk 35
    defaultConfig {
        applicationId "com.hiiamtrong.nfcswitch"
        minSdk 34
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }
    signingConfigs {
        release {
            def path = releaseValue("storeFile", "RELEASE_STORE_FILE")
            if (path) {
                storeFile = rootProject.file(path)
                storePassword = releaseValue("storePassword", "RELEASE_STORE_PASSWORD")
                keyAlias = releaseValue("keyAlias", "RELEASE_KEY_ALIAS")
                keyPassword = releaseValue("keyPassword", "RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile) signingConfig = signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
